<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cait Ai Chat</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gemini: {
              bgLight: '#f8f9fa',
              sidebarLight: '#f0f4f9',
              cardLight: '#ffffff',
              bgDark: '#131314',
              sidebarDark: '#1e1e20',
              cardDark: '#1e1e20',
              borderDark: '#2e2f31',
              accent: '#1a73e8',
              accentHover: '#1557b0'
            }
          }
        }
      }
    };
  </script>

  <!-- Marked.js for Markdown Rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.7);
    }
    
    /* Markdown Styles */
    .prose p { margin-bottom: 0.75rem; }
    .prose p:last-child { margin-bottom: 0; }
    .prose pre { 
      background-color: #1e1e1e; 
      color: #d4d4d4; 
      padding: 1rem; 
      border-radius: 0.5rem; 
      overflow-x: auto; 
      margin-top: 0.5rem; 
      margin-bottom: 0.5rem;
    }
    .prose code { 
      background-color: rgba(175, 184, 193, 0.2); 
      padding: 0.2rem 0.4rem; 
      border-radius: 0.25rem; 
      font-size: 0.875em;
    }
    .dark .prose code {
      background-color: rgba(110, 118, 129, 0.3);
    }
    .prose pre code { 
      background-color: transparent; 
      padding: 0;
    }
    .prose ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.75rem; }
    .prose ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.75rem; }
    .prose table { border-collapse: collapse; width: 100%; margin-bottom: 0.75rem; }
    .prose th, .prose td { border: 1px solid #e5e7eb; padding: 0.5rem; text-align: left; }
    .dark .prose th, .dark .prose td { border-color: #374151; }

    /* Cursor animation for streaming */
    .typing-cursor::after {
      content: '▋';
      display: inline-block;
      animation: blink 1s infinite;
      margin-left: 2px;
      color: #1a73e8;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body class="bg-gemini-bgLight dark:bg-gemini-bgDark text-gray-800 dark:text-gray-200 antialiased h-full">

  <!-- Fallback Initial Loader (Hidden after JS Init) -->
  <div id="loading" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-white dark:bg-gemini-bgDark">
    <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
    <p class="mt-4 text-gray-600 dark:text-gray-400 font-medium">Initializing Cait Ai App...</p>
  </div>

  <!-- App Wrapper with Full Viewport Height -->
  <div id="app" class="hidden flex flex-col md:flex-row h-dvh w-full overflow-hidden relative">

    <!-- Mobile Sidebar Backdrop Overlay -->
    <div id="sidebarBackdrop" class="fixed inset-0 bg-black/50 z-30 md:hidden hidden transition-opacity duration-300"></div>

    <!-- Sidebar Component -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-72 bg-gemini-sidebarLight dark:bg-gemini-sidebarDark transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col border-r border-gray-200 dark:border-gemini-borderDark">
      
      <!-- Top Action: New Chat -->
      <div class="p-4 flex items-center justify-between">
        <button id="btnNewChat" class="flex-1 flex items-center gap-3 px-4 py-3 rounded-full bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 hover:bg-blue-200 dark:hover:bg-blue-900/50 transition font-medium text-sm shadow-sm">
          <i class="fa-solid fa-plus text-base"></i>
          <span>New Chat</span>
        </button>
        <button id="btnCloseSidebar" class="md:hidden ml-2 p-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-white rounded-lg">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- Recent Chats Title -->
      <div class="px-5 py-2 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">
        Recent Chats
      </div>

      <!-- Chat History List -->
      <div id="chatHistoryList" class="flex-1 overflow-y-auto px-3 py-1 space-y-1">
        <!-- Chat items dynamically inserted here -->
      </div>

      <!-- Bottom Settings & Utilities -->
      <div class="p-3 border-t border-gray-200 dark:border-gemini-borderDark space-y-1">
        <button id="btnDarkMode" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-700 dark:text-gray-300 hover:bg-gray-200/60 dark:hover:bg-gray-800 transition text-sm">
          <i class="fa-solid fa-moon w-5 text-center text-gray-500 dark:text-gray-400" id="darkModeIcon"></i>
          <span id="darkModeLabel">Dark Theme</span>
        </button>
        <button id="btnOpenSettings" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-700 dark:text-gray-300 hover:bg-gray-200/60 dark:hover:bg-gray-800 transition text-sm">
          <i class="fa-solid fa-gear w-5 text-center text-gray-500 dark:text-gray-400"></i>
          <span>Settings</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Container -->
    <main class="flex-1 flex flex-col h-full min-w-0 bg-gemini-bgLight dark:bg-gemini-bgDark relative">
      
      <!-- Top Mobile / Main Header -->
      <header class="h-14 border-b border-gray-200 dark:border-gemini-borderDark flex items-center justify-between px-4 bg-gemini-bgLight dark:bg-gemini-bgDark shrink-0">
        <div class="flex items-center gap-3">
          <button id="btnOpenSidebar" class="md:hidden p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 rounded-lg">
            <i class="fa-solid fa-bars text-lg"></i>
          </button>
          <div class="flex items-center gap-2">
            <span class="text-xl font-semibold bg-gradient-to-r from-blue-600 via-purple-600 to-pink-500 bg-clip-text text-transparent">Cait Ai</span>
            <span id="currentModelBadge" class="text-xs px-2 py-0.5 rounded-full bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-400 font-mono truncate max-w-[140px] sm:max-w-[200px]">Model</span>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button id="btnClearCurrentChat" class="p-2 text-gray-500 hover:text-red-600 dark:text-gray-400 dark:hover:text-red-400 rounded-lg transition" title="Clear Current Chat">
            <i class="fa-regular fa-trash-can text-base"></i>
          </button>
        </div>
      </header>

      <!-- Messages Scroll Area -->
      <div id="chatMessages" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6">
        <!-- Messages rendered dynamically -->
      </div>

      <!-- Bottom Floating Sticky Input Container -->
      <div class="p-3 sm:p-4 bg-gemini-bgLight dark:bg-gemini-bgDark shrink-0">
        <div class="max-w-4xl mx-auto">
          <form id="chatForm" class="relative bg-white dark:bg-gemini-cardDark border border-gray-300 dark:border-gemini-borderDark rounded-2xl shadow-lg focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-transparent transition-all">
            <textarea
              id="userInput"
              rows="1"
              placeholder="Message Cait Ai..."
              class="w-full pl-4 pr-14 py-3.5 bg-transparent resize-none outline-none text-gray-800 dark:text-gray-100 max-h-40 min-h-[52px] leading-normal text-base sm:text-sm"
            ></textarea>
            
            <button 
              type="submit" 
              id="btnSend"
              class="absolute right-2.5 bottom-2.5 p-2 w-9 h-9 flex items-center justify-center rounded-full bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:hover:bg-blue-600 text-white transition shadow-sm"
              disabled
            >
              <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
          </form>
          <div class="text-[11px] text-center text-gray-400 dark:text-gray-500 mt-2">
            Cait Ai can make mistakes. Verify important info.
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 hidden backdrop-blur-sm">
    <div class="bg-white dark:bg-gemini-sidebarDark w-full max-w-md rounded-2xl shadow-2xl border border-gray-200 dark:border-gemini-borderDark overflow-hidden transform transition-all">
      <div class="px-6 py-4 border-b border-gray-200 dark:border-gemini-borderDark flex justify-between items-center">
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white flex items-center gap-2">
          <i class="fa-solid fa-sliders text-blue-500"></i> Settings
        </h3>
        <button id="btnCloseSettings" class="text-gray-400 hover:text-gray-600 dark:hover:text-white p-1 rounded-lg">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
        <!-- OpenRouter API Key Field -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-1">
            OpenRouter API Key
          </label>
          <div class="relative">
            <input 
              type="password" 
              id="inputApiKey" 
              class="w-full px-3 py-2 bg-gray-50 dark:bg-gemini-bgDark border border-gray-300 dark:border-gemini-borderDark rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 dark:text-gray-200 pr-10"
              placeholder="sk-or-v1-..."
            />
            <button type="button" id="toggleApiKeyVisibility" class="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-xs">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Model Choice Field -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-1">
            AI Model
          </label>
          <input 
            type="text" 
            id="inputModel" 
            class="w-full px-3 py-2 bg-gray-50 dark:bg-gemini-bgDark border border-gray-300 dark:border-gemini-borderDark rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 dark:text-gray-200"
            placeholder="nvidia/nemotron-3-ultra-550b-a55b:free"
          />
        </div>

        <!-- System Prompt Field -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-1">
            System Prompt
          </label>
          <textarea 
            id="inputSystemPrompt" 
            rows="3"
            class="w-full px-3 py-2 bg-gray-50 dark:bg-gemini-bgDark border border-gray-300 dark:border-gemini-borderDark rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 dark:text-gray-200 resize-none"
            placeholder="You are Cait Ai, a helpful AI assistant..."
          ></textarea>
        </div>
      </div>

      <div class="px-6 py-3 bg-gray-50 dark:bg-gemini-bgDark border-t border-gray-200 dark:border-gemini-borderDark flex justify-end gap-3">
        <button id="btnSaveSettings" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-xl transition shadow-sm">
          Save Changes
        </button>
      </div>
    </div>
  </div>

  <!-- Rename Modal -->
  <div id="renameModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 hidden backdrop-blur-sm">
    <div class="bg-white dark:bg-gemini-sidebarDark w-full max-w-sm rounded-2xl shadow-2xl border border-gray-200 dark:border-gemini-borderDark p-5 space-y-4">
      <h3 class="text-base font-semibold text-gray-900 dark:text-white">Rename Chat</h3>
      <input 
        type="text" 
        id="inputRenameTitle" 
        class="w-full px-3 py-2 bg-gray-50 dark:bg-gemini-bgDark border border-gray-300 dark:border-gemini-borderDark rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 dark:text-gray-200"
      />
      <div class="flex justify-end gap-2">
        <button id="btnCancelRename" class="px-3 py-1.5 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg text-sm">Cancel</button>
        <button id="btnConfirmRename" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium">Save</button>
      </div>
    </div>
  </div>

  <!-- Safe Script Block at Very End of Body -->
  <script>
    (function () {
      'use strict';

      // -------------------------------------------------------------
      // Application State & Configuration Defaults
      // -------------------------------------------------------------
      const DEFAULT_API_KEY = "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";
      const DEFAULT_MODEL = "nvidia/nemotron-3-ultra-550b-a55b:free";
      const DEFAULT_SYSTEM_PROMPT = "You are Cait Ai, a helpful, polite, and intelligent AI assistant.";

      let state = {
        apiKey: localStorage.getItem('cait_api_key') || localStorage.getItem('gemini_api_key') || DEFAULT_API_KEY,
        model: localStorage.getItem('cait_model') || localStorage.getItem('gemini_model') || DEFAULT_MODEL,
        systemPrompt: localStorage.getItem('cait_system_prompt') || localStorage.getItem('gemini_system_prompt') || DEFAULT_SYSTEM_PROMPT,
        darkMode: localStorage.getItem('cait_dark_mode') === 'true' || localStorage.getItem('gemini_dark_mode') === 'true',
        chats: JSON.parse(localStorage.getItem('cait_chats') || localStorage.getItem('gemini_chats') || '[]'),
        activeChatId: localStorage.getItem('cait_active_chat_id') || localStorage.getItem('gemini_active_chat_id') || null,
        isGenerating: false,
        renameTargetId: null
      };

      // Configure Marked Markdown parsing options
      if (window.marked) {
        marked.setOptions({
          gfm: true,
          breaks: true,
          headerIds: false,
          mangle: false
        });
      }

      // -------------------------------------------------------------
      // DOM Elements Selection
      // -------------------------------------------------------------
      const DOM = {
        loading: document.getElementById('loading'),
        app: document.getElementById('app'),
        sidebar: document.getElementById('sidebar'),
        sidebarBackdrop: document.getElementById('sidebarBackdrop'),
        btnOpenSidebar: document.getElementById('btnOpenSidebar'),
        btnCloseSidebar: document.getElementById('btnCloseSidebar'),
        btnNewChat: document.getElementById('btnNewChat'),
        chatHistoryList: document.getElementById('chatHistoryList'),
        btnDarkMode: document.getElementById('btnDarkMode'),
        darkModeIcon: document.getElementById('darkModeIcon'),
        darkModeLabel: document.getElementById('darkModeLabel'),
        btnOpenSettings: document.getElementById('btnOpenSettings'),
        btnCloseSettings: document.getElementById('btnCloseSettings'),
        settingsModal: document.getElementById('settingsModal'),
        inputApiKey: document.getElementById('inputApiKey'),
        toggleApiKeyVisibility: document.getElementById('toggleApiKeyVisibility'),
        inputModel: document.getElementById('inputModel'),
        inputSystemPrompt: document.getElementById('inputSystemPrompt'),
        btnSaveSettings: document.getElementById('btnSaveSettings'),
        currentModelBadge: document.getElementById('currentModelBadge'),
        chatMessages: document.getElementById('chatMessages'),
        chatForm: document.getElementById('chatForm'),
        userInput: document.getElementById('userInput'),
        btnSend: document.getElementById('btnSend'),
        btnClearCurrentChat: document.getElementById('btnClearCurrentChat'),
        renameModal: document.getElementById('renameModal'),
        inputRenameTitle: document.getElementById('inputRenameTitle'),
        btnCancelRename: document.getElementById('btnCancelRename'),
        btnConfirmRename: document.getElementById('btnConfirmRename')
      };

      // -------------------------------------------------------------
      // App Initialization
      // -------------------------------------------------------------
      function initApp() {
        try {
          // Sync Theme
          applyTheme(state.darkMode);

          // Ensure active chat exists or create one
          if (!state.chats.length) {
            createNewChat();
          } else if (!state.activeChatId || !state.chats.find(c => c.id === state.activeChatId)) {
            state.activeChatId = state.chats[0].id;
          }

          // Populate Settings Input Defaults
          DOM.inputApiKey.value = state.apiKey;
          DOM.inputModel.value = state.model;
          DOM.inputSystemPrompt.value = state.systemPrompt;
          DOM.currentModelBadge.textContent = state.model.split('/')[1] || state.model;

          // Event Listeners Registration
          bindEvents();

          // Render Chat Sessions & Messages
          renderHistoryList();
          renderMessages();

          // Hide Loader, Display App
          DOM.loading.classList.add('hidden');
          DOM.app.classList.remove('hidden');

          // Focus User Input
          DOM.userInput.focus();
        } catch (error) {
          console.error("Initialization Error:", error);
          alert("Error initializing application. Resetting state...");
          localStorage.clear();
          location.reload();
        }
      }

      // -------------------------------------------------------------
      // Event Handling & Binding
      // -------------------------------------------------------------
      function bindEvents() {
        // Sidebar Toggles
        DOM.btnOpenSidebar.addEventListener('click', toggleSidebar);
        DOM.btnCloseSidebar.addEventListener('click', toggleSidebar);
        DOM.sidebarBackdrop.addEventListener('click', toggleSidebar);

        // Chat Actions
        DOM.btnNewChat.addEventListener('click', () => {
          createNewChat();
          if (window.innerWidth < 768) toggleSidebar();
        });

        DOM.btnClearCurrentChat.addEventListener('click', clearCurrentChatMessages);

        // Dark Mode Toggle
        DOM.btnDarkMode.addEventListener('click', () => {
          state.darkMode = !state.darkMode;
          localStorage.setItem('gemini_dark_mode', state.darkMode);
          applyTheme(state.darkMode);
        });

        // Settings Modal Open/Close/Save
        DOM.btnOpenSettings.addEventListener('click', () => {
          DOM.inputApiKey.value = state.apiKey;
          DOM.inputModel.value = state.model;
          DOM.inputSystemPrompt.value = state.systemPrompt;
          DOM.settingsModal.classList.remove('hidden');
        });
        DOM.btnCloseSettings.addEventListener('click', () => DOM.settingsModal.classList.add('hidden'));
        DOM.btnSaveSettings.addEventListener('click', saveSettings);

        DOM.toggleApiKeyVisibility.addEventListener('click', () => {
          const type = DOM.inputApiKey.getAttribute('type') === 'password' ? 'text' : 'password';
          DOM.inputApiKey.setAttribute('type', type);
          DOM.toggleApiKeyVisibility.querySelector('i').className = type === 'password' ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
        });

        // Rename Modal Buttons
        DOM.btnCancelRename.addEventListener('click', () => DOM.renameModal.classList.add('hidden'));
        DOM.btnConfirmRename.addEventListener('click', saveRenameChat);

        // Input Auto-Resize & Send Enabling
        DOM.userInput.addEventListener('input', handleInputResize);
        DOM.userInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (!state.isGenerating && DOM.userInput.value.trim()) {
              DOM.chatForm.dispatchEvent(new Event('submit'));
            }
          }
        });

        // Send Form Submit
        DOM.chatForm.addEventListener('submit', handleFormSubmit);
      }

      // -------------------------------------------------------------
      // UI Utility & Theme Functions
      // -------------------------------------------------------------
      function applyTheme(isDark) {
        if (isDark) {
          document.documentElement.classList.add('dark');
          DOM.darkModeIcon.className = 'fa-solid fa-sun w-5 text-center text-amber-400';
          DOM.darkModeLabel.textContent = 'Light Theme';
        } else {
          document.documentElement.classList.remove('dark');
          DOM.darkModeIcon.className = 'fa-solid fa-moon w-5 text-center text-gray-500';
          DOM.darkModeLabel.textContent = 'Dark Theme';
        }
      }

      function toggleSidebar() {
        const isHidden = DOM.sidebar.classList.contains('-translate-x-full');
        if (isHidden) {
          DOM.sidebar.classList.remove('-translate-x-full');
          DOM.sidebarBackdrop.classList.remove('hidden');
        } else {
          DOM.sidebar.classList.add('-translate-x-full');
          DOM.sidebarBackdrop.classList.add('hidden');
        }
      }

      function handleInputResize() {
        DOM.userInput.style.height = 'auto';
        DOM.userInput.style.height = Math.min(DOM.userInput.scrollHeight, 160) + 'px';
        DOM.btnSend.disabled = !DOM.userInput.value.trim() || state.isGenerating;
      }

      function saveSettings() {
        state.apiKey = DOM.inputApiKey.value.trim() || DEFAULT_API_KEY;
        state.model = DOM.inputModel.value.trim() || DEFAULT_MODEL;
        state.systemPrompt = DOM.inputSystemPrompt.value.trim() || DEFAULT_SYSTEM_PROMPT;

        localStorage.setItem('cait_api_key', state.apiKey);
        localStorage.setItem('cait_model', state.model);
        localStorage.setItem('cait_system_prompt', state.systemPrompt);

        DOM.currentModelBadge.textContent = state.model.split('/')[1] || state.model;
        DOM.settingsModal.classList.add('hidden');
      }

      // -------------------------------------------------------------
      // Chat Data Management
      // -------------------------------------------------------------
      function saveChats() {
        localStorage.setItem('cait_chats', JSON.stringify(state.chats));
        localStorage.setItem('cait_active_chat_id', state.activeChatId);
      }

      // -------------------------------------------------------------
      // Chat Data Management
      // -------------------------------------------------------------
      function saveChats() {
        localStorage.setItem('gemini_chats', JSON.stringify(state.chats));
        localStorage.setItem('gemini_active_chat_id', state.activeChatId);
      }

      function createNewChat() {
        const newChat = {
          id: 'chat_' + Date.now(),
          title: 'New Conversation',
          messages: [],
          updatedAt: Date.now()
        };
        state.chats.unshift(newChat);
        state.activeChatId = newChat.id;
        saveChats();
        renderHistoryList();
        renderMessages();
      }

      function getActiveChat() {
        return state.chats.find(c => c.id === state.activeChatId) || null;
      }

      function deleteChat(chatId, event) {
        event.stopPropagation();
        if (state.chats.length <= 1) {
          state.chats = [];
          saveChats();
          createNewChat();
          return;
        }

        state.chats = state.chats.filter(c => c.id !== chatId);
        if (state.activeChatId === chatId) {
          state.activeChatId = state.chats[0].id;
        }
        saveChats();
        renderHistoryList();
        renderMessages();
      }

      function openRenameModal(chatId, currentTitle, event) {
        event.stopPropagation();
        state.renameTargetId = chatId;
        DOM.inputRenameTitle.value = currentTitle;
        DOM.renameModal.classList.remove('hidden');
        DOM.inputRenameTitle.focus();
      }

      function saveRenameChat() {
        const newTitle = DOM.inputRenameTitle.value.trim();
        if (newTitle && state.renameTargetId) {
          const chat = state.chats.find(c => c.id === state.renameTargetId);
          if (chat) {
            chat.title = newTitle;
            saveChats();
            renderHistoryList();
          }
        }
        DOM.renameModal.classList.add('hidden');
        state.renameTargetId = null;
      }

      function clearCurrentChatMessages() {
        const activeChat = getActiveChat();
        if (activeChat && activeChat.messages.length > 0) {
          activeChat.messages = [];
          activeChat.title = "New Conversation";
          saveChats();
          renderHistoryList();
          renderMessages();
        }
      }

      // -------------------------------------------------------------
      // Render Helpers
      // -------------------------------------------------------------
      function renderHistoryList() {
        DOM.chatHistoryList.innerHTML = '';
        state.chats.forEach(chat => {
          const isActive = chat.id === state.activeChatId;
          const item = document.createElement('div');
          item.className = `group flex items-center justify-between px-3 py-2.5 rounded-xl cursor-pointer text-sm transition ${
            isActive 
              ? 'bg-blue-100/70 dark:bg-blue-950/40 text-blue-700 dark:text-blue-300 font-medium' 
              : 'text-gray-700 dark:text-gray-300 hover:bg-gray-200/60 dark:hover:bg-gray-800/60'
          }`;

          item.innerHTML = `
            <div class="flex items-center gap-2.5 min-w-0 flex-1">
              <i class="fa-regular fa-message text-xs opacity-70"></i>
              <span class="truncate">${escapeHTML(chat.title)}</span>
            </div>
            <div class="items-center gap-1 hidden group-hover:flex ml-2">
              <button class="btn-rename p-1 text-gray-400 hover:text-gray-600 dark:hover:text-white rounded" title="Rename">
                <i class="fa-solid fa-pen text-xs"></i>
              </button>
              <button class="btn-delete p-1 text-gray-400 hover:text-red-500 rounded" title="Delete">
                <i class="fa-solid fa-trash text-xs"></i>
              </button>
            </div>
          `;

          item.addEventListener('click', () => {
            if (state.activeChatId !== chat.id) {
              state.activeChatId = chat.id;
              saveChats();
              renderHistoryList();
              renderMessages();
              if (window.innerWidth < 768) toggleSidebar();
            }
          });

          item.querySelector('.btn-rename').addEventListener('click', (e) => openRenameModal(chat.id, chat.title, e));
          item.querySelector('.btn-delete').addEventListener('click', (e) => deleteChat(chat.id, e));

          DOM.chatHistoryList.appendChild(item);
        });
      }

      function renderMessages() {
        const activeChat = getActiveChat();
        DOM.chatMessages.innerHTML = '';

        if (!activeChat || activeChat.messages.length === 0) {
          DOM.chatMessages.innerHTML = `
            <div class="h-full flex flex-col items-center justify-center text-center p-6 space-y-4">
              <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-blue-500 via-purple-500 to-pink-500 flex items-center justify-center text-white text-2xl shadow-lg">
                <i class="fa-solid fa-sparkles"></i>
              </div>
              <h2 class="text-2xl font-semibold text-gray-800 dark:text-gray-100">Hello there</h2>
              <p class="text-gray-500 dark:text-gray-400 max-w-md text-sm">
                How can I help you today? Ask Cait Ai a question, summarize text, analyze code, or write content.
              </p>
            </div>
          `;
          return;
        }

        activeChat.messages.forEach(msg => {
          appendMessageUI(msg.role, msg.content);
        });

        scrollToBottom();
      }

      function appendMessageUI(role, content = '') {
        const isUser = role === 'user';
        const msgWrapper = document.createElement('div');
        msgWrapper.className = `flex gap-3 sm:gap-4 max-w-4xl mx-auto ${isUser ? 'justify-end' : 'justify-start'}`;

        if (isUser) {
          msgWrapper.innerHTML = `
            <div class="max-w-[85%] sm:max-w-[75%] bg-blue-600 text-white rounded-2xl rounded-tr-sm px-4 py-3 text-sm shadow-sm leading-relaxed">
              ${escapeHTML(content).replace(/\n/g, '<br/>')}
            </div>
          `;
        } else {
          msgWrapper.innerHTML = `
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-600 text-white flex items-center justify-center text-xs shrink-0 shadow-sm">
              <i class="fa-solid fa-sparkles"></i>
            </div>
            <div class="flex-1 min-w-0 space-y-1">
              <div class="text-xs font-semibold text-gray-500 dark:text-gray-400">Cait Ai</div>
              <div class="prose dark:prose-invert text-sm text-gray-800 dark:text-gray-100 leading-relaxed message-content min-h-[24px]">
                ${content ? parseMarkdown(content) : ''}
              </div>
            </div>
          `;
        }

        DOM.chatMessages.appendChild(msgWrapper);
        scrollToBottom();
        return msgWrapper;
      }

      function scrollToBottom() {
        DOM.chatMessages.scrollTop = DOM.chatMessages.scrollHeight;
      }

      function parseMarkdown(text) {
        if (window.marked) {
          return marked.parse(text);
        }
        return escapeHTML(text).replace(/\n/g, '<br/>');
      }

      function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
          tag => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
          }[tag] || tag)
        );
      }

      // -------------------------------------------------------------
      // API Communication & Real-time SSE Streaming
      // -------------------------------------------------------------
      async function handleFormSubmit(e) {
        e.preventDefault();
        const text = DOM.userInput.value.trim();
        if (!text || state.isGenerating) return;

        const activeChat = getActiveChat();
        if (!activeChat) return;

        // Reset input UI
        DOM.userInput.value = '';
        handleInputResize();

        // 1. Save User Message
        activeChat.messages.push({ role: 'user', content: text });
        if (activeChat.messages.length === 1) {
          // Auto generate title from first query
          activeChat.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
          renderHistoryList();
        }
        saveChats();

        // Render User UI Message
        appendMessageUI('user', text);

        // 2. Prepare AI Container UI
        const aiMsgWrapper = appendMessageUI('assistant', '');
        const contentContainer = aiMsgWrapper.querySelector('.message-content');
        contentContainer.classList.add('typing-cursor');

        state.isGenerating = true;
        DOM.btnSend.disabled = true;

        let accumulatedContent = '';

        try {
          // Construct API payload
          const apiMessages = [
            { role: 'system', content: state.systemPrompt },
            ...activeChat.messages.map(m => ({ role: m.role, content: m.content }))
          ];

          const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${state.apiKey}`,
              'Content-Type': 'application/json',
              'HTTP-Referer': window.location.href,
              'X-Title': 'Cait Ai Chat App'
            },
            body: JSON.stringify({
              model: state.model,
              messages: apiMessages,
              stream: true
            })
          });

          if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.error?.message || `API Error: ${response.status} ${response.statusText}`);
          }

          // Read Stream Streamer
          const reader = response.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
              const trimmed = line.trim();
              if (trimmed.startsWith('data: ')) {
                const dataStr = trimmed.replace('data: ', '').trim();
                if (dataStr === '[DONE]') break;

                try {
                  const parsed = JSON.parse(dataStr);
                  const delta = parsed.choices?.[0]?.delta?.content || '';
                  if (delta) {
                    accumulatedContent += delta;
                    contentContainer.innerHTML = parseMarkdown(accumulatedContent);
                    scrollToBottom();
                  }
                } catch (e) {
                  // Ignore JSON parse errors for incomplete chunks
                }
              }
            }
          }

          // Final flush if anything left in buffer
          if (buffer.trim().startsWith('data: ')) {
            const dataStr = buffer.trim().replace('data: ', '').trim();
            if (dataStr !== '[DONE]') {
              try {
                const parsed = JSON.parse(dataStr);
                const delta = parsed.choices?.[0]?.delta?.content || '';
                accumulatedContent += delta;
              } catch (e) {}
            }
          }

          if (!accumulatedContent) {
            accumulatedContent = "*(Received empty response)*";
          }

        } catch (error) {
          console.error("Chat Generation Error:", error);
          accumulatedContent = `<span class="text-red-500 font-medium">⚠️ Error: ${escapeHTML(error.message)}</span>`;
        } finally {
          contentContainer.classList.remove('typing-cursor');
          contentContainer.innerHTML = parseMarkdown(accumulatedContent);

          // Save final assistant message
          activeChat.messages.push({ role: 'assistant', content: accumulatedContent });
          activeChat.updatedAt = Date.now();
          saveChats();

          state.isGenerating = false;
          DOM.btnSend.disabled = !DOM.userInput.value.trim();
          scrollToBottom();
        }
      }

      // Initialize App when DOM Content Loaded
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
      } else {
        initApp();
      }
    })();
  </script>
</body>
</html>
